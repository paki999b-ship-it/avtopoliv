# Сборка Android-версии АртЛандшафт (Capacitor + Gradle).
#
# На раннере ubuntu-latest Android SDK уже установлен, поэтому APK собирается
# без ручной подготовки окружения. Запускается вручную или по тегу v*.
name: build-android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # AGP 8.13 требует JDK 17+, а Gradle 8.14 не идёт на JDK новее 24-го:
      # 21 — версия, на которой сходятся оба ограничения.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - run: npm run typecheck
      # Тесты движка, слоя базы под node:sqlite и того же слоя под SQLite в
      # WebAssembly — последнее и есть проверка мобильной сборки.
      - run: npm test

      # Нативный проект в репозитории есть, но ассеты в него не коммитятся:
      # vite build + cap sync кладут свежий бандл в assets/public.
      - name: Сборка веб-бандла и перенос в нативный проект
        working-directory: packages/mobile-app
        run: |
          npm run build
          npx cap sync android

      - name: Иконки и заставка из логотипа
        run: node scripts/build-android-icons.ts

      - name: assembleDebug
        working-directory: packages/mobile-app/android
        run: ./gradlew --no-daemon assembleDebug

      # Релизный APK собирается, только если заведён ключ подписи. Секреты:
      # ANDROID_KEYSTORE_BASE64 — .jks в base64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: assembleRelease
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: packages/mobile-app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew --no-daemon assembleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: artlandshaft-android
          path: packages/mobile-app/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
